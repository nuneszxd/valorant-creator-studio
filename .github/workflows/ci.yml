name: CI

# Runs the automated tests on GitHub's servers (not on anyone's personal or work computer).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress
      - name: Install backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Show tool versions
        shell: bash
        run: |
          python --version
          ffmpeg -version | head -n 1 || echo "ffmpeg not available"
      - name: Run backend tests
        shell: bash
        working-directory: backend
        run: python -m pytest -q --tb=short 2>&1 | tee ../pytest.log
      - name: Annotate failures
        if: failure()
        shell: bash
        run: bash scripts/ci/annotate_log.sh pytest.log "pytest ${{ matrix.os }}"

  windows-smoke:
    name: setup and start (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run setup.ps1 (same script the user runs)
        id: setup
        shell: powershell
        run: ./scripts/setup.ps1 2>&1 | Tee-Object -FilePath setup.log
      - name: Start the app, check API and UI, stop it
        id: smoke
        shell: powershell
        run: ./scripts/ci/smoke.ps1
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          [ "${{ steps.setup.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh setup.log "setup ps1"
          [ "${{ steps.smoke.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh smoke.log "smoke"
          exit 0

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund 2>&1 | tee ../npm-install.log
      - name: Type check
        id: tsc
        run: npm run typecheck 2>&1 | tee ../tsc.log
      - name: Unit tests
        id: vitest
        run: npm test 2>&1 | tee ../vitest.log
      - name: Build
        id: build
        run: npm run build 2>&1 | tee ../build.log
      - name: Annotate failures
        if: failure()
        working-directory: .
        run: |
          [ "${{ steps.install.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh npm-install.log "npm install"
          [ "${{ steps.tsc.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh tsc.log "tsc"
          [ "${{ steps.vitest.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh vitest.log "vitest"
          [ "${{ steps.build.outcome }}" = "failure" ] && bash scripts/ci/annotate_log.sh build.log "vite build"
          exit 0
