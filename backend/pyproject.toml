[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-creator-studio"
version = "0.1.0"
description = "Local app that turns Valorant lives/VODs into short vertical clips and tracks content trends."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Local speech-to-text (CPU on AMD GPUs; downloads a model on first use, only with explicit consent).
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
vcs = "vcs.__main__:main"

[tool.setuptools.packages.find]
include = ["vcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_ffmpeg: test needs ffmpeg/ffprobe installed (skipped otherwise)",
]
